name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Testes do backend
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local
        ports: ["8000:8000"]
    defaults:
      run:
        working-directory: aws-sam
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Testes unitários (#42)
        run: uv run --no-project --python 3.12 --with-requirements requirements-dev.txt pytest tests/unitarios

      - name: Testes de integração (#43)
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
        run: uv run --no-project --python 3.12 --with-requirements requirements-dev.txt pytest tests/integracao

  frontend:
    name: Build do frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
