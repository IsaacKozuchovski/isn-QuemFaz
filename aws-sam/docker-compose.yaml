services:
  dynamodb:
    image: amazon/dynamodb-local
    container_name: dynamodb
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"
    networks: [sam-local]

  # Cria localmente as mesmas tabelas declaradas no template.yaml
  create-table:
    image: amazon/aws-cli
    depends_on: [dynamodb]
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: sa-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        DDB="aws dynamodb --endpoint-url http://dynamodb:8000"
        for i in $$(seq 1 30); do
          $$DDB list-tables > /dev/null 2>&1 && break
          echo "retry $$i"
          sleep 1
        done

        $$DDB create-table --table-name Membros \
          --attribute-definitions AttributeName=membroId,AttributeType=S AttributeName=nucleoId,AttributeType=S \
          --key-schema AttributeName=membroId,KeyType=HASH \
          --global-secondary-indexes 'IndexName=nucleoId-index,KeySchema=[{AttributeName=nucleoId,KeyType=HASH}],Projection={ProjectionType=ALL}' \
          --billing-mode PAY_PER_REQUEST > /dev/null || exit 1

        $$DDB create-table --table-name Nucleos \
          --attribute-definitions AttributeName=nucleoId,AttributeType=S \
          --key-schema AttributeName=nucleoId,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST > /dev/null || exit 1

        $$DDB create-table --table-name Tarefas \
          --attribute-definitions AttributeName=nucleoId,AttributeType=S AttributeName=tarefaId,AttributeType=S \
          --key-schema AttributeName=nucleoId,KeyType=HASH AttributeName=tarefaId,KeyType=RANGE \
          --billing-mode PAY_PER_REQUEST > /dev/null || exit 1

        echo "TABLE CREATED"
    networks: [sam-local]

networks:
  sam-local:
    name: sam-local
